name: pocket_ledger
description: "PocketLedger - Offline-first personal finance tracker with Ghana Cedi (GHS) as default currency."
publish_to: 'none'
version: 1.2.1+2

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Material 3 Expressive / Stitch Design System
  dynamic_color: ^1.7.0
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2

  # State Management
  flutter_riverpod: ^2.6.1

  # Local Database (SQLite via Drift)
  drift: ^2.23.1
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.1

  # Utilities
  intl: ^0.19.0
  uuid: ^4.5.1
  shared_preferences: ^2.3.4
  url_launcher: ^6.3.1
  http: ^1.2.2
  package_info_plus: ^8.1.3

  # Charts & Visualizations
  fl_chart: ^0.70.2

  # File Export
  share_plus: ^10.1.4
  pdf: ^3.11.2
  excel: ^4.0.6

  # Permissions
  permission_handler: ^11.3.1

  # PWA / Web Support
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  lints: ^5.1.1

  # Code Generation
  build_runner: ^2.4.14
  drift_dev: ^2.23.1
  json_serializable: ^6.9.4

  # App Icon Generation
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

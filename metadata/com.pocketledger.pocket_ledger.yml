Builds:
  - versionName: '1.2.4'
    versionCode: 3
    commit: v1.2.4
    subdir: android
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
    build:
      - cd $$flutter$$
      - git submodule update --init --recursive
      - export PATH="$$flutter$$/bin:$$flutter$$/bin/cache/dart-sdk/bin:$$PATH$$"
      - flutter config --no-analytics
      - flutter pub get
      - flutter build apk --release

